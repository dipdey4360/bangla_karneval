name: Maven Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test all modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BK_MEMBERSHIP_INTEGRATION: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: membership_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: membership_test_only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d membership_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build and test frontend, database and backend
        run: mvn --batch-mode --no-transfer-progress clean install
