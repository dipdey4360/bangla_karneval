<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — Bangla Karneval</title>
    <link rel="stylesheet" href="css/common.css?v=mobile-1">
    <link rel="stylesheet" href="css/header.css?v=mobile-1">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/programmes.css?v=programmes-1">
</head>

<body>
    <div class="page-wrapper">
        <div id="header-container"></div>
        <main class="page-content">

            <section class="contact-hero">
                <div class="container">
                    <h1>Contact Us</h1>
                    <p>Contact us with questions about events or membership.</p>
                </div>
            </section>

            <section class="contact-section">
                <div class="container">
                    <div class="contact-layout">

                        <!-- Contact info -->
                        <div class="contact-info">
                            <h2>Get in Touch</h2>

                            <div class="contact-info-item">
                                <div class="contact-info-icon">
                                    <i class="fa-solid fa-phone" style="color:#74C0FC"></i>
                                </div>
                                <div class="contact-info-text">
                                    <h4>Phone / WhatsApp</h4>
                                    <a href="#" id="contact-phone-link">
                                        <span id="contact-phone">Loading...</span>
                                    </a>
                                </div>
                            </div>

                            <div class="contact-info-item">
                                <div class="contact-info-icon">
                                    <i class="fa-solid fa-envelope" style="color:#30E1AC"></i>
                                </div>
                                <div class="contact-info-text">
                                    <h4>Email Address</h4>
                                    <a href="#" id="contact-email-link">
                                        <span id="contact-email">Loading...</span>
                                    </a>
                                </div>
                            </div>

                            <div class="contact-info-item">
                                <div class="contact-info-icon">
                                    <i class="fa-solid fa-location-dot" style="color:#F39C12"></i>
                                </div>
                                <div class="contact-info-text">
                                    <h4>Event Location</h4>
                                    <span id="contact-location">Loading...</span>
                                </div>
                            </div>

                            <div class="contact-info-item">
                                <div class="contact-info-icon">
                                    <i class="fa-solid fa-clock" style="color:#f0f2f7"></i>
                                </div>
                                <div class="contact-info-text">
                                    <h4>Response Time</h4>
                                    <span>We usually respond within 24–48 hours</span>
                                </div>
                            </div>

                            <!-- Social links -->
                            <div style="margin-top:var(--spacing-xl)">
                                <h2 style="margin-bottom:var(--spacing-md)">Follow Us</h2>
                                <div style="display:flex; gap:var(--spacing-md); align-items:center">

                                    <a id="contact-facebook" href="#" target="_blank" rel="noopener"
                                       class="social-contact-btn">
                                        <img src="/assets/images/facebook.png" alt="Facebook">
                                        <span>Facebook</span>
                                    </a>
                                    <a id="contact-instagram" href="#" target="_blank" rel="noopener"
                                       class="social-contact-btn">
                                        <img src="/assets/images/instagram.png" alt="Instagram">
                                        <span>Instagram</span>
                                    </a>
                                </div>
                            </div>

                        </div>

                        <!-- Contact form -->
                        <div class="contact-form-card">
                            <h2>Send Us a Message</h2>
                            <div id="contact-alert"></div>
                            <form id="contact-form" novalidate>
                                <div class="form-group">
                                    <label class="form-label" for="c-name">Full Name *</label>
                                    <input type="text" id="c-name" class="form-input" required
                                        placeholder="Your full name">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="c-email">Email Address *</label>
                                    <input type="email" id="c-email" class="form-input" required
                                        placeholder="your@email.com">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="c-message">Message *</label>
                                    <textarea id="c-message" class="form-textarea" rows="6" required
                                        placeholder="How can we help you?"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary"
                                    style="width:100%;padding:14px;font-size:1rem">
                                    Send Message ✉️
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </section>

        </main>
        <div id="footer-container"></div>
    </div>
    <script src="js/common.js?v=programmes-1"></script>
    <script src="js/header.js?v=programmes-1"></script>
    <script src="js/footer.js?v=programmes-1"></script>
    <script src="js/contact.js?v=programmes-1"></script>
</body>

</html>
