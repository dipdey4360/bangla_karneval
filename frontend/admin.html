<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Bangla Karneval</title>
    <link rel="stylesheet" href="css/common.css?v=mobile-1">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="assets/images/favicon.ico">
<link rel="stylesheet" href="css/programmes.css?v=programmes-1">
</head>

<body>
    <div class="admin-login-page">
        <div class="admin-login-card">

            <div class="admin-login-logo">
                <div class="logo-icon">🎊</div>
                <h1>Bangla Karneval</h1>
                <p>Admin Panel — <span data-event-year></span></p>
            </div>

            <div id="login-error" class="alert alert-error login-error"></div>

            <form id="admin-login-form" class="admin-login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="admin-email">Email Address</label>
                    <input type="email" id="admin-email" class="form-input" required
                        placeholder="admin@bangla karneval.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="admin-password">Password</label>
                    <div style="position:relative">
                        <input type="password" id="admin-password" class="form-input" required placeholder="••••••••"
                            autocomplete="current-password" style="padding-right:48px">
                        <button type="button" id="toggle-password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                     background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-secondary)"
                            onclick="togglePasswordVisibility()">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary login-btn">
                    Sign In
                </button>
            </form>

            <p style="text-align:center;margin-top:var(--spacing-lg);font-size:13px;color:var(--text-secondary)">
                <a href="index.html" style="color:var(--text-secondary)">← Back to main site</a>
            </p>

        </div>
    </div>

    <script src="js/common.js?v=programmes-1"></script>
    <script src="js/admin_login.js?v=programmes-1"></script>
    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('admin-password');
            const btn = document.getElementById('toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
    </script>
</body>

</html>
