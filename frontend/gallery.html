<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Bangla Karneval</title>
    <link rel="stylesheet" href="css/common.css?v=dom-4">
    <link rel="stylesheet" href="css/header.css?v=mobile-1">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/gallery.css?v=gallery-simple-2">
    <link rel="icon" href="assets/images/favicon.ico">
<link rel="stylesheet" href="css/programmes.css?v=club-1">
<link rel="stylesheet" href="css/club-theme.css?v=spacing-3">
</head>

<body class="club-site">
<div class="page-wrapper">
    <div id="header-container"></div>
    <main class="page-content">

        <!-- ── Hero ──────────────────────────────────────────── -->
        <section class="gallery-hero">
            <div class="container">
                <h1>Gallery</h1>
                <p>Memories from Bangla Karneval events</p>
            </div>
        </section>

        <!-- ── Previous Years Archive ────────────────────────── -->
        <section class="archive-section" aria-label="Event galleries">
            <div class="container">
                <!-- Year tabs — populated dynamically -->
                <div class="year-tabs" id="year-tabs">
                    <!-- skeleton tab placeholders -->
                    <div class="year-tab skeleton" style="width:64px;height:38px;border-radius:20px"></div>
                    <div class="year-tab skeleton" style="width:64px;height:38px;border-radius:20px"></div>
                    <div class="year-tab skeleton" style="width:64px;height:38px;border-radius:20px"></div>
                </div>

                <div class="gallery-grid" id="year-gallery-grid">
                    <p class="gallery-empty">Select an event to view photos.</p>
                </div>
            </div>
        </section>

    </main>
    <div id="footer-container"></div>
</div>

<!-- ── Lightbox ───────────────────────────────────────────── -->
<div class="lightbox" id="lightbox">
    <div class="lightbox-content">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightbox-image" src="" alt="Gallery image">
        <video id="lightbox-video" controls playsinline hidden></video>
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
</div>

<script src="js/common.js?v=club-fixes-2"></script>
<script src="js/header.js?v=club-fixes-2"></script>
<script src="js/footer.js?v=club-fixes-2"></script>
<script src="js/gallery.js?v=club-fixes-2"></script>
</body>
</html>
